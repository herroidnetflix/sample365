<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>Navvora Telugu</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05050a;
    --text: #f5f5f7;
    --muted: rgba(245,245,247,.65);
    --accent: #0a84ff;
    --ease: cubic-bezier(.22,1,.36,1);
    --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }

  /* ---------- Liquid glass ---------- */
  .glass {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(255,255,255,.08),
      0 12px 40px rgba(0,0,0,.45);
  }
  .glass::before { /* specular highlight */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.28), transparent 45%);
    mix-blend-mode: soft-light;
  }

  /* ---------- Animated background ---------- */
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
  .b1 { width: 55vmax; height: 55vmax; background: #3a1c9c; top: -20vmax; left: -15vmax; }
  .b2 { width: 45vmax; height: 45vmax; background: #0a6cff; bottom: -20vmax; right: -10vmax; animation-delay: -8s; }
  .b3 { width: 35vmax; height: 35vmax; background: #c2185b; top: 35%; left: 45%; opacity: .35; animation-delay: -15s; }
  @keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.15); } }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; z-index: 50;
    transform: translateX(-50%); width: min(92vw, 1100px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 10px 20px; border-radius: 999px;
    transition: background .4s var(--ease), transform .5s var(--ease);
    animation: dropIn .9s var(--spring) both;
  }
  .brand { font-weight: 800; letter-spacing: .04em; font-size: 1.05rem; }
  .brand span { background: linear-gradient(90deg, #7ab8ff, #ff8ad8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill-btn { padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
  header.scrolled { background: linear-gradient(135deg, rgba(20,20,30,.6), rgba(20,20,30,.4)); }
  @keyframes dropIn { from { opacity: 0; transform: translate(-50%, -30px) scale(.94); } }

  /* ---------- Hero ---------- */
  .hero { position: relative; min-height: 82vh; display: flex; align-items: flex-end; padding: 0 5vw 9vh; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, #1b1240, #0a2a5c, #4a1240); background-size: 200% 200%; animation: shift 14s ease infinite; }
  .hero-bg img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 22s ease-in-out infinite alternate; }
  .hero-bg::after { content: ""; position: absolute; inset: 0; background:
      linear-gradient(to top, var(--bg) 4%, rgba(5,5,10,.35) 45%, rgba(5,5,10,.15)),
      linear-gradient(to right, rgba(5,5,10,.7), transparent 60%); }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1) translate(-1.5%, -1%); } }
  @keyframes shift { 50% { background-position: 100% 50%; } }
  .hero-card { max-width: 620px; padding: 28px 30px 30px; border-radius: 30px; animation: rise 1s var(--ease) .25s both; }
  .chip { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.16); }
  .hero h1 { font-size: clamp(2rem, 6vw, 3.8rem); line-height: 1.02; margin: 14px 0 10px; letter-spacing: -.02em; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .92rem; margin-bottom: 8px; }
  .meta span:not(:last-child)::after { content: "•"; margin-left: 8px; opacity: .6; }
  .desc { color: var(--muted); line-height: 1.5; margin: 8px 0 0; max-width: 52ch; }
  .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn-play {
    display: inline-flex; align-items: center; gap: 10px; padding: 13px 28px; border-radius: 999px;
    background: #fff; color: #000; font-weight: 700; font-size: 1.05rem;
    transition: transform .35s var(--spring), box-shadow .35s;
    box-shadow: 0 8px 30px rgba(255,255,255,.25);
  }
  .btn-play:hover { transform: scale(1.06); box-shadow: 0 10px 40px rgba(255,255,255,.4); }
  .btn-play:active { transform: scale(.97); }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.97); } }

  /* ---------- Rows ---------- */
  main { position: relative; margin-top: -4vh; padding-bottom: 60px; }
  .row { margin: 0 0 34px; }
  .row h2 { margin: 0 5vw 12px; font-size: 1.25rem; letter-spacing: -.01em; }
  .scroller-wrap { position: relative; }
  .scroller {
    display: flex; gap: 16px; overflow-x: auto; padding: 14px 5vw 26px;
    scroll-snap-type: x proximity; scroll-padding: 0 5vw; scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: clamp(220px, 26vw, 330px); aspect-ratio: 16/9; border-radius: 22px; overflow: hidden;
    position: relative; scroll-snap-align: start; text-align: left;
    background: linear-gradient(135deg, #24204d, #0f2f5c);
    border: 1px solid rgba(255,255,255,.16);
    transition: transform .5s var(--spring), box-shadow .4s, border-color .4s;
    opacity: 0; transform: translateY(24px);
  }
  .card.in { opacity: 1; transform: none; transition: transform .5s var(--spring), box-shadow .4s, border-color .4s, opacity .7s var(--ease); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
  .card:hover { transform: scale(1.06) translateY(-4px); z-index: 5; border-color: rgba(255,255,255,.4); box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 40px rgba(122,184,255,.25); }
  .card:hover img { transform: scale(1.08); }
  .card:active { transform: scale(.98); }
  .card-info {
    position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 9px 13px; border-radius: 15px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
    background: rgba(20,20,30,.38); border: 1px solid rgba(255,255,255,.18);
  }
  .card-title { font-weight: 650; font-size: .93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-dur { font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .card-play {
    position: absolute; top: 50%; left: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: .4s var(--spring);
  }
  .card:hover .card-play { opacity: 1; transform: scale(1); }
  .arrow {
    position: absolute; top: 50%; width: 46px; height: 46px; margin-top: -30px; border-radius: 50%; z-index: 6;
    display: none; place-items: center; font-size: 1.3rem; opacity: 0; transition: opacity .3s, transform .3s var(--spring);
  }
  .arrow.l { left: 1.2vw; } .arrow.r { right: 1.2vw; }
  .arrow:hover { transform: scale(1.12); }
  @media (hover: hover) and (min-width: 800px) { .arrow { display: grid; } .scroller-wrap:hover .arrow { opacity: 1; } }

  /* ---------- Player modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; }
  .modal.open { opacity: 1; visibility: visible; }
  .dialog { width: min(1000px, 100%); max-height: 94vh; overflow: auto; border-radius: 28px; padding: 12px;
    transform: translateY(40px) scale(.94); transition: transform .6s var(--spring); }
  .modal.open .dialog { transform: none; }
  .dialog video { width: 100%; display: block; border-radius: 18px; background: #000; max-height: 70vh; }
  .dialog-info { padding: 16px 12px 8px; }
  .dialog-info h3 { margin: 0 0 6px; font-size: 1.4rem; }
  .close { position: absolute; top: 20px; right: 20px; z-index: 3; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.1rem; transition: transform .3s var(--spring); }
  .close:hover { transform: scale(1.12) rotate(90deg); }
  .err { color: #ff9a9a; font-size: .9rem; margin-top: 8px; display: none; }

  .tracks { display: none; gap: 10px 22px; flex-wrap: wrap; padding: 12px 12px 2px; }
  .tracks.show { display: flex; }
  .track-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .track-group[hidden] { display: none; }
  .track-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .tchip {
    padding: 7px 15px; border-radius: 999px; font-size: .86rem; font-weight: 600;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
    transition: transform .35s var(--spring), background .25s, color .25s;
  }
  .tchip:hover { transform: scale(1.07); }
  .tchip.active { background: #fff; color: #000; border-color: #fff; }
  video::cue { font-size: 1.1em; background: rgba(0,0,0,.6); color: #fff; }
  .apps { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 12px 0; }

  .state { text-align: center; padding: 30vh 5vw; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 10px 0 40px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } .card { opacity: 1; transform: none; } }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/controls.css">
<style>
  /* Shaka Player integration */
  .shaka-video-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
  }
  .shaka-video-container video {
    width: 100%;
    height: 100%;
    max-height: none;
    border-radius: 0;
    object-fit: contain;
  }
  .shaka-controls-container {
    border-radius: 0 0 18px 18px;
  }
  .shaka-overflow-menu,
  .shaka-settings-menu {
    border-radius: 16px !important;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    background: rgba(20,20,28,.88) !important;
    border: 1px solid rgba(255,255,255,.16);
  }
</style>
</head>
<body>
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header class="glass" id="header">
  <div class="brand"><span id="brand">Navvora Telugu</span></div>
  <button class="pill-btn glass" id="shuffle">Surprise me</button>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-card glass" id="heroCard" hidden>
    <span class="chip">Featured</span>
    <h1 id="heroTitle"></h1>
    <div class="meta" id="heroMeta"></div>
    <p class="desc" id="heroDesc"></p>
    <div class="actions">
      <button class="btn-play" id="heroPlay"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Play</button>
    </div>
  </div>
  <div class="state" id="state" style="padding:0 0 20vh">Loading…</div>
</section>

<main id="rows"></main>
<footer id="footer"></footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="dialog glass" role="dialog" aria-modal="true">
    <button class="close glass" id="close" aria-label="Close">✕</button>
    <div class="shaka-video-container" id="videoContainer">
      <video id="video" playsinline preload="metadata"></video>
    </div>
    <div class="tracks" id="tracks">
      <div class="track-group" id="langGroup" hidden><span class="track-label">Language</span><div class="track-group" id="langChips"></div></div>
      <div class="track-group" id="subGroup" hidden><span class="track-label">Subtitles</span><div class="track-group" id="subChips"></div></div>
    </div>
    <div class="apps">
      <span class="track-label">Open in app</span>
      <div class="track-group" id="appChips"></div>
    </div>
    <div class="dialog-info">
      <h3 id="mTitle"></h3>
      <div class="meta" id="mMeta"></div>
      <p class="desc" id="mDesc"></p>
      <div class="err" id="err"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/shaka-player.ui.js"></script>
<script>
  // ➜ Change your site name here
  const SITE_NAME = "Navvora Telugu";

  const $ = id => document.getElementById(id);
  const video = $("video"), modal = $("modal"), err = $("err");
  let VIDEOS = [];

  document.title = SITE_NAME;
  $("brand").textContent = SITE_NAME;
  $("footer").textContent = "© " + new Date().getFullYear() + " " + SITE_NAME;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function posterImg(v) {
    if (!v.poster) return null;
    const img = new Image();
    img.src = v.poster; img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();   // fall back to gradient
    return img;
  }
  function fillMeta(box, v) {
    box.textContent = "";
    [v.year, v.genre, v.duration].filter(Boolean).forEach(t => box.append(el("span", null, String(t))));
  }

  /* ---------- Player ---------- */
  function openPlayer(v) {
    err.style.display = "none";
    $("mTitle").textContent = v.title || "Untitled";
    fillMeta($("mMeta"), v);
    $("mDesc").textContent = v.description || "";
    current = v; activeUrl = v.url;

    // external subtitle files (.vtt) listed in videos.json
    video.querySelectorAll("track").forEach(t => t.remove());
    extTracks = [];
    (v.subtitles || []).forEach((s, i) => {
      const t = document.createElement("track");
      t.kind = "subtitles";
      t.label = s.label || s.lang || ("Subtitle " + (i + 1));
      t.srclang = s.lang || "";
      t.src = s.url;
      video.append(t);
      t.track.mode = "disabled";
      extTracks.push(t.track);
    });

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    buildTrackUI();
    buildAppButtons();
    setSource(v.url, 0, true);
  }

  /* ---------- Languages, subtitles, HLS ---------- */
  let shakaPlayer = null, shakaUi = null, current = null, activeUrl = "", extTracks = [];

  function showErr(msg) { err.textContent = msg; err.style.display = "block"; }
  async function initShaka() {
    if (shakaPlayer) return;
    if (!window.shaka) throw new Error("Shaka Player library failed to load.");
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      throw new Error("This browser does not support Shaka Player.");
    }

    shakaPlayer = new shaka.Player(video);
    shakaUi = new shaka.ui.Overlay(shakaPlayer, $("videoContainer"), video);

    shakaPlayer.addEventListener("error", e => {
      const d = e.detail || {};
      showErr("Shaka playback error: " + (d.code || "unknown"));
    });
    shakaPlayer.addEventListener("trackschanged", buildTrackUI);
    shakaPlayer.addEventListener("adaptation", buildTrackUI);
  }

  async function setSource(url, resumeAt, autoplay) {
    err.style.display = "none";
    try {
      await initShaka();
      activeUrl = url;

      await shakaPlayer.load(url);

      if (resumeAt > 0 && isFinite(resumeAt)) {
        try { video.currentTime = resumeAt; } catch (_) {}
      }

      buildTrackUI();
      buildAppButtons();

      if (autoplay) {
        video.play().catch(() => {});
      }
    } catch (e) {
      console.error(e);
      showErr("Playback failed: " + (e && e.message ? e.message : "unsupported stream"));
    }
  }

  function switchLanguage(url) {
    const t = video.currentTime, playing = !video.paused;
    activeUrl = url;
    buildAppButtons();
    setSource(url, t, playing);
  }

  const LANGS = { te:"Telugu", tel:"Telugu", hi:"Hindi", hin:"Hindi", ta:"Tamil", tam:"Tamil", ml:"Malayalam", mal:"Malayalam",
    kn:"Kannada", kan:"Kannada", en:"English", eng:"English", bn:"Bengali", ben:"Bengali", mr:"Marathi", mar:"Marathi",
    ur:"Urdu", urd:"Urdu", gu:"Gujarati", guj:"Gujarati", pa:"Punjabi", pan:"Punjabi", fr:"French", fre:"French", fra:"French",
    es:"Spanish", spa:"Spanish", ja:"Japanese", jpn:"Japanese", ko:"Korean", kor:"Korean", zh:"Chinese", chi:"Chinese", zho:"Chinese", und:"Default" };
  const pretty = l => LANGS[String(l).toLowerCase()] || l;

  function chips(groupId, boxId, options, activeIdx) {
    const group = $(groupId), box = $(boxId);
    box.textContent = "";
    group.hidden = options.length < 2;
    options.forEach((o, i) => {
      const b = el("button", "tchip" + (i === activeIdx ? " active" : ""), pretty(o.label));
      b.onclick = () => {
        o.select();
        Array.from(box.children).forEach((c, j) => c.classList.toggle("active", j === i));
      };
      box.append(b);
    });
    $("tracks").classList.toggle("show", !$("langGroup").hidden || !$("subGroup").hidden);
  }

  function buildTrackUI() {
    const v = current;
    if (!v) return;

    /* Language (audio) */
    let langs = [], langActive = 0;
    if (v.languages && v.languages.length) {
      // separate video file per language (listed in videos.json)
      const all = [{ label: v.defaultLanguage || "Original", url: v.url }, ...v.languages];
      langs = all.map(l => ({ label: l.label || "Language", select: () => switchLanguage(l.url) }));
      langActive = Math.max(0, all.findIndex(l => l.url === activeUrl));
    } else if (shakaPlayer) {
      // Audio tracks inside HLS/DASH/other Shaka-supported media.
      const tracks = shakaPlayer.getVariantTracks()
        .filter(t => t.audioId != null || t.language || t.audioCodec)
        .filter((t, i, arr) => arr.findIndex(x =>
          (x.language || "") === (t.language || "") &&
          (x.audioCodec || "") === (t.audioCodec || "") &&
          (x.audioChannelsCount || 0) === (t.audioChannelsCount || 0)
        ) === i);

      langs = tracks.map(t => ({
        label: t.label || pretty(t.language) || ("Audio " + (t.id || "")),
        select: () => {
          const variants = shakaPlayer.getVariantTracks().filter(x =>
            (x.language || "") === (t.language || "") &&
            (x.audioCodec || "") === (t.audioCodec || "") &&
            (x.audioChannelsCount || 0) === (t.audioChannelsCount || 0)
          );
          if (variants.length) shakaPlayer.selectVariantTrack(variants[0], true);
          buildTrackUI();
        }
      }));
      const active = shakaPlayer.getVariantTracks().find(t => t.active);
      if (active) {
        langActive = Math.max(0, langs.findIndex(l =>
          l.label === (active.label || pretty(active.language) || ("Audio " + (active.id || "")))
        ));
      }
    chips("langGroup", "langChips", langs, langActive);

    /* Subtitles */
    const hide = () => {
      Array.from(video.textTracks).forEach(t => { t.mode = "disabled"; });
      if (shakaPlayer) shakaPlayer.setTextTrackVisibility(false);
    };
    const subs = [{ label: "Off", select: hide, active: () => false }];
    extTracks.forEach(t => subs.push({ label: t.label, select: () => { hide(); t.mode = "showing"; }, active: () => t.mode === "showing" }));
    if (shakaPlayer) {
      const textTracks = shakaPlayer.getTextTracks ? shakaPlayer.getTextTracks() : [];
      textTracks.forEach((t, i) => subs.push({
        label: t.label || pretty(t.language) || ("Subtitle " + (i + 1)),
        select: () => { hide(); shakaPlayer.setTextTrackVisibility(true); shakaPlayer.selectTextTrack(t); },
        active: () => t.active
      }));
    } else {
      Array.from(video.textTracks)
        .filter(t => !extTracks.includes(t) && /subtitles|captions/.test(t.kind))
        .forEach(t => subs.push({ label: t.label || t.language || "Subtitle", select: () => { hide(); t.mode = "showing"; }, active: () => t.mode === "showing" }));
    }
    const on = subs.findIndex((s, i) => i > 0 && s.active());
    chips("subGroup", "subChips", subs, on < 0 ? 0 : on);
  }
  video.addEventListener("loadedmetadata", buildTrackUI);

  /* ---------- Open in external app (VLC / MX Player) ---------- */
  const UA = navigator.userAgent;
  const IS_ANDROID = /Android/i.test(UA);
  const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function androidIntent(url, pkg, title) {
    const scheme = new URL(url).protocol.replace(":", "");
    const rest = url.slice(scheme.length + 1);            // "//host/path?query"
    return "intent:" + rest + "#Intent;action=android.intent.action.VIEW;scheme=" + scheme +
      ";type=video/*;package=" + pkg + ";S.title=" + encodeURIComponent(title) + ";end";
  }

  function downloadM3U(url, title) {
    const text = "#EXTM3U\n#EXTINF:-1," + title.replace(/[\r\n]+/g, " ") + "\n" + url + "\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "audio/x-mpegurl" }));
    a.download = (title.replace(/[^\w\-]+/g, "_") || "video") + ".m3u";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { prompt("Copy this link:", text); return; }
    const old = btn.textContent;
    btn.textContent = "Copied ✓";
    setTimeout(() => { btn.textContent = old; }, 1500);
  }

  function buildAppButtons() {
    const box = $("appChips");
    box.textContent = "";
    const v = current;
    if (!v) return;
    const url = activeUrl || v.url, title = v.title || "Video";
    const add = (label, fn, pause = true) => {
      const b = el("button", "tchip", label);
      b.onclick = () => { if (pause) video.pause(); fn(b); };
      box.append(b);
    };
    if (IS_ANDROID) {
      add("VLC", () => { location.href = androidIntent(url, "org.videolan.vlc", title); });
      add("MX Player", () => { location.href = androidIntent(url, "com.mxtech.videoplayer.ad", title); });
    } else if (IS_IOS) {
      add("VLC", () => { location.href = "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(url); });
    } else {
      add("VLC / any player (.m3u)", () => downloadM3U(url, title));
    }
    add("Copy link", b => copyText(url, b), false);
  }
  async function closePlayer() {
    if (shakaPlayer) {
      try { await shakaPlayer.unload(); } catch (_) {}
    }
    current = null;
    video.querySelectorAll("track").forEach(t => t.remove());
    extTracks = [];
    $("tracks").classList.remove("show");
    video.pause();
    video.removeAttribute("src");
    video.load();                       // stops the download
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }
  video.addEventListener("error", () => {
    if (!shakaPlayer) return;
    if (video.error) showErr("Video element error: " + video.error.code);
  });
  $("close").onclick = closePlayer;
  modal.addEventListener("click", e => { if (e.target === modal) closePlayer(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closePlayer(); });
  $("shuffle").onclick = () => { if (VIDEOS.length) openPlayer(VIDEOS[Math.floor(Math.random() * VIDEOS.length)]); };

  /* ---------- Build page ---------- */
  function buildHero(v) {
    const bg = $("heroBg");
    const img = posterImg(v);
    if (img) { img.loading = "eager"; bg.prepend(img); }
    $("heroTitle").textContent = v.title || "Untitled";
    fillMeta($("heroMeta"), v);
    $("heroDesc").textContent = v.description || "";
    $("heroDesc").hidden = !v.description;
    $("heroPlay").onclick = () => openPlayer(v);
    $("heroCard").hidden = false;
    $("state").remove();
  }

  function buildCard(v) {
    const c = el("button", "card");
    c.setAttribute("aria-label", "Play " + (v.title || "video"));
    const img = posterImg(v); if (img) c.append(img);
    const play = el("div", "card-play glass");
    play.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
    const info = el("div", "card-info");
    info.append(el("span", "card-title", v.title || "Untitled"));
    if (v.duration) info.append(el("span", "card-dur", v.duration));
    c.append(play, info);
    c.onclick = () => openPlayer(v);
    return c;
  }

  function buildRows() {
    const groups = new Map();
    VIDEOS.forEach(v => {
      const k = v.category || "Navvora Telugu";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(v);
    });
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold: .15 });

    groups.forEach((items, name) => {
      const row = el("section", "row");
      row.append(el("h2", null, name));
      const wrap = el("div", "scroller-wrap");
      const sc = el("div", "scroller");
      items.forEach((v, i) => {
        const c = buildCard(v);
        c.style.transitionDelay = (i * 70) + "ms";
        sc.append(c); io.observe(c);
      });
      const l = el("button", "arrow l glass", "‹"), r = el("button", "arrow r glass", "›");
      l.onclick = () => sc.scrollBy({ left: -sc.clientWidth * .8, behavior: "smooth" });
      r.onclick = () => sc.scrollBy({ left: sc.clientWidth * .8, behavior: "smooth" });
      wrap.append(sc, l, r); row.append(wrap);
      $("rows").append(row);
    });
  }

  addEventListener("scroll", () => $("header").classList.toggle("scrolled", scrollY > 40), { passive: true });

  async function init() {
    try {
      const res = await fetch("videos.json?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      VIDEOS = data.filter(v => v && v.url);
      if (!VIDEOS.length) { $("state").textContent = "No films yet. Add some to videos.json."; return; }
      buildHero(VIDEOS.find(v => v.featured) || VIDEOS[0]);
      buildRows();
      const n = parseInt(new URLSearchParams(location.search).get("v"), 10);   // ?v=2 opens 2nd film
      if (n && VIDEOS[n - 1]) openPlayer(VIDEOS[n - 1]);
    } catch (e) {
      $("state").textContent = "Could not load videos.json (" + e.message + "). Check it is valid JSON.";
    }
  }
  init();
</script>
</body>
</html>
