<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 48px;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 0%, #1b1b2f, #0b0b10 60%);
    color: #f2f2f7;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .glass {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .player { overflow: hidden; }
  video { width: 100%; display: block; background: #000; max-height: 75vh; }
  .now { padding: 12px 16px; font-size: .95rem; word-break: break-word; }
  .error { padding: 0 16px 12px; color: #ff8a8a; font-size: .9rem; display: none; }
  h2 { font-size: 1.05rem; margin: 24px 0 10px; }
  .list { display: grid; gap: 8px; }
  .item {
    text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.06); color: inherit; font-size: 1rem;
    border: 1px solid rgba(255,255,255,.1);
  }
  .item.active { border-color: #0a84ff; }
  .msg { opacity: .65; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Videos</h1>

  <div class="glass player">
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="now" id="now">Loading…</div>
    <div class="error" id="error"></div>
  </div>

  <h2>Library</h2>
  <div class="list" id="list"></div>
</div>

<script>
  const video = document.getElementById("video");
  const now = document.getElementById("now");
  const err = document.getElementById("error");
  const list = document.getElementById("list");

  function play(v, btn) {
    err.style.display = "none";
    video.src = v.url;
    video.load();
    video.play().catch(() => {});   // autoplay may be blocked; press play if so
    now.textContent = v.title;
    document.querySelectorAll(".item").forEach(b => b.classList.toggle("active", b === btn));
  }

  video.addEventListener("error", () => {
    const codes = {
      1: "aborted",
      2: "network error (blocked, expired, or server asleep)",
      3: "file can't be decoded (codec or corrupt file)",
      4: "format not supported, or the link isn't a playable video"
    };
    const c = video.error ? video.error.code : 0;
    err.textContent = "Playback failed, code " + c + ": " + (codes[c] || "unknown");
    err.style.display = "block";
  });

  async function load() {
    try {
      const res = await fetch("videos.json?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const videos = await res.json();
      if (!videos.length) { now.textContent = "No videos yet. Add some to videos.json."; return; }

      videos.forEach((v, i) => {
        const b = document.createElement("button");
        b.className = "item";
        b.textContent = v.title || ("Video " + (i + 1));
        b.onclick = () => play(v, b);
        list.append(b);
      });

      // ?v=2 opens the 2nd video directly
      const start = Math.max(0, (parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
      const first = Math.min(start, videos.length - 1);
      play(videos[first], list.children[first]);
    } catch (e) {
      now.textContent = "Could not load videos.json (" + e.message + "). Check the file is valid JSON.";
    }
  }
  load();
</script>
</body>
</html>
